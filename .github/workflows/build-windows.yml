name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle renderer
        run: npm run build

      - name: Package Windows x64 (electron-builder)
        run: npm run build:win:cross 2>&1 | tee package.log
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publish build log for debugging
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f package.log
          git commit -m "ci: publish build log" || true
          git push origin HEAD:main || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koishi-desktop-pet-win32-x64
          path: dist/eb/win-unpacked
          if-no-files-found: ignore
